name: Scrape IND recognised sponsors (one-off)

# One-off utility, unrelated to this site's data. Runs here because the
# sandboxed dev environment cannot reach ind.nl — the egress proxy denies
# CONNECT — and because a government site is more likely to answer a datacentre
# runner than a blocked sandbox.
#
# Read-only: never writes to data/ and never commits. The spreadsheet comes back
# as a build artifact.
#
# Safe to delete once the file has been collected.
on:
  workflow_dispatch:
    inputs:
      saved_page:
        description: 'Optional: path to an HTML file committed in the repo, if ind.nl blocks the runner'
        default: ''

concurrency:
  group: scrape-ind-sponsors
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 lxml openpyxl

      - name: Scrape
        run: python scripts/scrape_ind_sponsors.py ${{ inputs.saved_page }}

      - name: Describe the output
        if: always()
        run: |
          ls -la ind_recognised_sponsors_work.xlsx || { echo "no output file produced"; exit 0; }
          echo "sha256: $(sha256sum ind_recognised_sponsors_work.xlsx | cut -d' ' -f1)"
          # Small enough to carry back through the job log, which is the only
          # channel out of here that does not need a browser download.
          SIZE=$(stat -c%s ind_recognised_sponsors_work.xlsx)
          echo "bytes: $SIZE"
          if [ "$SIZE" -lt 1200000 ]; then
            echo "---BEGIN BASE64---"
            base64 -w 0 ind_recognised_sponsors_work.xlsx
            echo ""
            echo "---END BASE64---"
          else
            echo "(too large to inline; use the artifact)"
          fi

      - name: Commit the spreadsheet to this branch
        # The sandbox that drives this cannot reach either the artifact blob
        # storage or ind.nl, so git is the only channel the file can come back
        # through. Removed again once collected.
        if: success()
        run: |
          mkdir -p out
          mv ind_recognised_sponsors_work.xlsx out/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/ind_recognised_sponsors_work.xlsx
          git commit -m "chore: IND recognised sponsors export [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          cp out/ind_recognised_sponsors_work.xlsx ./ind_recognised_sponsors_work.xlsx

      - name: Upload the spreadsheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ind-recognised-sponsors
          path: ind_recognised_sponsors_work.xlsx
          retention-days: 7
          if-no-files-found: warn
